<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonora 99.3 FM - En Vivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%);
        }

        .player-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .player-container:hover {
            transform: translateY(-5px);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .play-btn {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 35px -5px rgba(236, 72, 153, 0.6);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 5px;
            transition: all 0.3s;
        }

        .pause-icon {
            width: 20px;
            height: 25px;
            border-style: solid;
            border-width: 0 6px 0 6px;
            border-color: transparent #ffffff transparent #ffffff;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 10px #ef4444;
            animation: pulse 2s infinite;
        }

        .status-dot.active {
            background-color: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        .status-text {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 600;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 20px;
            border-radius: 50px;
        }

        .volume-icon {
            width: 20px;
            height: 20px;
            fill: #94a3b8;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #475569;
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        .footer {
            margin-top: 50px;
            color: #64748b;
            font-size: 0.8rem;
            text-align: center;
        }

        /* Waves Animation */
        .waves {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            height: 30px;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .waves.playing {
            opacity: 1;
        }

        .wave {
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            border-radius: 2px;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .wave:nth-child(1) { animation-delay: -1.1s; }
        .wave:nth-child(2) { animation-delay: -1.0s; }
        .wave:nth-child(3) { animation-delay: -0.9s; }
        .wave:nth-child(4) { animation-delay: -0.8s; }
        .wave:nth-child(5) { animation-delay: -0.7s; }

        @keyframes bounce {
            0%, 40%, 100% { transform: scaleY(0.4); }
            20% { transform: scaleY(1); }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h1 class="logo">SONORA FM</h1>
        <p class="subtitle">99.3 Monagas</p>

        <button class="play-btn" id="playBtn" onclick="togglePlay()">
            <div class="play-icon" id="btnIcon"></div>
        </button>

        <div class="status-container">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">DETENIDO</span>
        </div>

        <div class="waves" id="waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>

        <div class="volume-container">
            <svg class="volume-icon" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1" oninput="changeVolume()">
        </div>
    </div>

    <div class="footer">
        &copy; 2026 Grupo La Verdad de Monagas. Todos los derechos reservados.
    </div>

    <!-- Hidden Audio Element -->
    <audio id="radioPlayer" preload="none">
        <source src="https://sonora.monagasvision.com/radio.aac" type="audio/aac">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <script>
        const audio = document.getElementById('radioPlayer');
        const playBtn = document.getElementById('playBtn');
        const btnIcon = document.getElementById('btnIcon');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const waves = document.getElementById('waves');
        const volumeSlider = document.getElementById('volumeSlider');
        
        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                // To save bandwidth on pause, reset src
                audio.src = '';
                isPlaying = false;
                
                // UI Updates
                btnIcon.className = 'play-icon';
                btnIcon.style.marginLeft = '5px';
                statusDot.classList.remove('active');
                statusText.textContent = 'DETENIDO';
                waves.classList.remove('playing');
            } else {
                // Refresh URL to bypass cache
                audio.src = 'https://sonora.monagasvision.com/radio.aac?t=' + new Date().getTime();
                
                statusText.textContent = 'CONECTANDO...';
                
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true;
                        
                        // UI Updates
                        btnIcon.className = 'pause-icon';
                        btnIcon.style.marginLeft = '0';
                        statusDot.classList.add('active');
                        statusText.textContent = 'EN VIVO';
                        waves.classList.add('playing');
                    }).catch(error => {
                        console.error('Playback failed:', error);
                        statusText.textContent = 'ERROR AL CONECTAR';
                        isPlaying = false;
                    });
                }
            }
        }

        function changeVolume() {
            audio.volume = volumeSlider.value;
        }

        // Initialize volume
        audio.volume = volumeSlider.value;
    </script>
</body>
</html>
